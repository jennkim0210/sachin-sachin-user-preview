  <script type="module">const TOPICS = [
  {id:'love', name:'연애', icon:'heart', description:'설렘과 마음 사이'},
  {id:'relationship', name:'인간관계', icon:'people', description:'서로의 거리와 진심'},

  {id:'family', name:'가족', icon:'home', description:'가까워서 어려운 사이'},
  {id:'daily', name:'일상', icon:'sun', description:'마음에 남은 작은 순간'},
  {id:'etc', name:'그 밖의 이야기', icon:'more', description:'어디에 담아도 괜찮아요'},
];
const SAMPLES = [
  {id:'work-1',category:'work',title:'퇴근하고 나면, 나를 위한 시간이 없는 기분이에요.',body:'회사에서는 할 일을 잘 해내고 있는데, 집에 돌아오면 아무것도 하고 싶지 않아요.\n\n쉬고 있어도 시간을 버리는 것 같고, 새로운 걸 시작하자니 힘이 없어요. 다른 분들은 퇴근 후에 어떻게 자기 마음을 돌보나요?',tags:['퇴근후','내속도'],answers:2},
  {id:'work-2',category:'work',title:'잘하고 있다는 말을 너무 기다리게 돼요.',body:'일을 마치고 나서도 계속 반응을 확인하게 돼요. 스스로 만족하는 기준을 만들고 싶은데 쉽지 않네요. 비슷한 마음을 느껴본 적 있나요?',tags:['일하는마음','내속도'],answers:1},
  {id:'love-1',category:'love',title:'좋아하는 마음과 익숙해진 마음, 어떻게 구분하나요?',body:'연락이 오면 반갑고, 만나면 편해요. 그런데 이게 좋아하는 건지 그냥 좋은 친구인 건지 모르겠어요. 이성의 입장에서 어떤 순간에 마음을 확신했는지 듣고 싶어요.',tags:['마음알아가기','관계의거리'],answers:3},
  {id:'love-2',category:'love',title:'답장은 느린데, 만나면 시간이 너무 빨리 가요.',body:'대화할 때는 정말 잘 맞는데 연락은 하루에 몇 번뿐이에요. 연락하는 속도랑 마음의 크기는 다른 걸까요? 여러분은 어떤 편인지 궁금해요.',tags:['마음알아가기','연락의온도'],answers:1},
  {id:'love-3',category:'love',title:'“같이 가자”는 그 한마디, 그냥 해도 되는 거겠죠?',body:'혼자 가려고 찾은 전시가 있는데 문득 그 사람이 생각났어요. 괜히 의미를 두는 것 같아서 아직 링크만 저장해 뒀네요. 먼저 약속을 잡는 게 왜 이렇게 어려울까요?',tags:['마음알아가기','첫한마디'],answers:2},
  {id:'relationship-1',category:'relationship',title:'친한 사이에도 혼자 있을 시간이 필요하다고 말해도 될까요?',body:'소중한 친구지만 매일 연락하는 건 조금 버거워요. 마음이 멀어진 건 아닌데 어떻게 전하면 좋을까요? 상대가 서운하지 않았으면 좋겠어요.',tags:['관계의거리','내속도'],answers:2},
  {id:'career-1',category:'career',title:'새로운 시작이 늦은 건 아닐까요?',body:'좋아하던 일을 다시 배워보고 싶어요. 지금 하던 일을 잘 이어가는 것과 다른 길을 찾는 것 사이에서 고민 중이에요. 비슷한 선택을 한 분의 이야기가 궁금해요.',tags:['새로운시작','내속도'],answers:1},
  {id:'family-1',category:'family',title:'부모님께 독립하고 싶다는 말을 꺼내기가 어려워요.',body:'함께 사는 시간이 편하면서도 이제는 혼자 생활을 꾸려보고 싶어요. 걱정하실까 봐 계속 미루고 있어요. 마음을 어떻게 전하면 좋을까요?',tags:['새로운시작','관계의거리'],answers:0},
  {id:'daily-1',category:'daily',title:'주말을 혼자 보내도 잘 보낸 하루라고 느끼고 싶어요.',body:'일정이 없는 주말이면 괜히 누군가와 비교하게 돼요. 혼자서도 편안하고 기분 좋게 시간을 보내는 작은 습관이 있다면 나눠 주세요.',tags:['일상나누기','내속도'],answers:2},
  {id:'daily-2',category:'daily',title:'좋은 노래를 들으면, 보내줄 사람이 생각나요?',body:'우연히 발견한 노래가 너무 좋아서 누군가에게 보내고 싶었어요. 사소한 걸 같이 좋아해 줄 사람이 있으면 좋겠다는 생각이 드는 저녁이네요.',tags:['일상나누기','마음알아가기'],answers:1},
];
const MY_SAMPLE = {id:'my-first',category:'relationship',title:'괜찮은 척하는 게 익숙해진 것 같아요.',body:'친구들 앞에서는 항상 이야기를 들어주는 편이에요. 그런데 막상 제 마음을 말하려면 별일 아닌 것 같아서 웃고 넘기게 돼요.\n\n누군가에게 기대고 싶다는 말을 어떻게 시작하면 좋을까요?',tags:['마음알아가기','관계의거리'],own:true,answers:2};
const SAMPLE_ANSWERS = [
  {id:'answer-a',alias:'익명의 답변 01',body:'저도 늘 들어주는 쪽이었어요. 그래서인지 힘들다는 말도 잘해야 할 것 같더라고요.\n\n어느 날 친구에게 “해결해 주지 않아도 돼. 오늘은 그냥 내 얘기 좀 들어줄래?”라고 말했어요. 생각보다 가볍게 시작해도 괜찮았어요.\n\n당신의 마음도 충분히 들어줄 만한 이야기예요.'},
  {id:'answer-b',alias:'익명의 답변 02',body:'늘 괜찮은 사람일 필요는 없다고 생각해요. 가장 편한 한 사람에게 작은 이야기부터 해보면 어떨까요? 오늘 유난히 피곤했다는 말부터요. 그 정도 시작으로도 괜찮아요.'},
];
function initialState() { return {version:1, concerns:[], answers:[], connections:{}, messages:[], draft:{category:'',title:'',body:'',tags:''}}; }
function filterConcerns(items, choice) {
  if (!choice) return [];
  if (choice.category) return TOPICS.some(t=>t.id===choice.category) ? items.filter(c=>!c.own && c.category===choice.category) : [];
  if (choice.tag) return items.filter(c=>!c.own && c.tags.includes(choice.tag));
  return [];
}
function profilesVisible(connection) { return Boolean(connection && !connection.closed && connection.mineReveal && connection.theirReveal); }
function chatAllowed(connection) { return profilesVisible(connection) && connection.mineChat===true && connection.theirChat===true; }
function transition(connection, action) {
  const next={...connection};
  if(action==='request' && !next.closed) next.mineReveal=true;
  if(action==='demo-reveal' && next.mineReveal && !next.closed) next.theirReveal=true;
  if(action==='choose-chat' && profilesVisible(next)) next.mineChat=true;
  if(action==='demo-chat' && profilesVisible(next) && next.mineChat) next.theirChat=true;
  if(action==='close') { next.closed=true; next.mineChat=false; next.theirChat=false; }
  return next;
}


const STORAGE_KEY='sachin-user-preview-v1';
const $=selector=>document.querySelector(selector);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=initialState();
try { const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)); if(saved?.version===1) state={...state,...saved}; } catch {}
const paths={
  feed:'<path d="M4 5h16v11H9l-5 4V5Z"/><path d="M8 9h8M8 12h5"/>',

  work:'<rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12c5 4 13 4 18 0M12 12v4"/>',

};
const icon=name=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]??paths.feed}</svg>`;
const topic=id=>TOPICS.find(t=>t.id===id)?.name??'이야기';
const tags=items=>`<div class="tags">${items.map(t=>`<span>#${esc(t)}</span>`).join('')}</div>`;

const button=(action,label,cls='btn btn-primary',extra='')=>`<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
const previewFoot=()=>`<footer class="preview-foot">${link('/me','사용자 화면 미리보기 · 예시 콘텐츠','quiet-link')}</footer>`;

const privacy=copy=>`<div class="privacy-inline">${icon('lock')}<p>${copy}</p></div>`;

function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{toast('브라우저 저장 공간이 없어, 이번 방문에서만 유지돼요.');}}
let toastTimer;
function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>{$('#toast').hidden=true;},3600);}
function route(){const [path,query='']=(location.hash.slice(1)||'/home').split('?');return {path,params:new URLSearchParams(query)};}
function navigate(path){if(location.hash==='#'+path)render();else location.hash=path;}
function getConcern(id){return [MY_SAMPLE,...state.concerns,...SAMPLES].find(c=>c.id===id);}
function ownAnswers(c){return c.id===MY_SAMPLE.id || c.mockAnswers ? SAMPLE_ANSWERS : [];}
function connectionKey(concernId,answerId){return `${concernId}_${answerId}`;}
function currentConnection(){return state.connections[route().params.get('id')];}
function allConnections(){return Object.values(state.connections);}


function brand(){return '<a class="wordmark" href="#/home" aria-label="사친사친 홈">사친사친<span class="brand-dot">✳</span></a>';}
function portrait(cls=''){return `<div class="portrait ${cls}" role="img" aria-label="여름산책의 가상 프로필 사진"></div>`;}
function choiceFrom(p){return p.has('category')?{category:p.get('category')}:p.has('tag')?{tag:p.get('tag')}:null;}
function choiceQuery(c){return c?.category?'category='+encodeURIComponent(c.category):c?.tag?'tag='+encodeURIComponent(c.tag):'';}
const tabs=[['/listen','발견','compass'],['/mine','내 이야기','mine'],['/connections','연결','connection'],['/me','나','me']];
function shell(title,body,{back,chat=false,home=false,wide=false}={}){
 const {path}=route(),active=path.startsWith('/mine')?'/mine':/connection|chat/.test(path)?'/connections':path==='/me'?'/me':'/listen';
 const nav=tabs.map(([href,label,symbol])=>`<a href="#${href}" ${href===active?'class="active" aria-current="page"':''}>${icon(symbol)}<span>${label}</span></a>`).join('');
 if(home)return `<div class="landing"><header class="landing-header">${brand()}<nav aria-label="서비스 메뉴">${link('/listen','이야기 발견','nav-link')}${link('/mine','내 이야기','nav-link')}${link('/connections','연결','nav-link')}${link('/listen','시작하기 '+icon('arrow'),'btn btn-primary btn-sm')}</nav></header><main>${body}</main><footer class="landing-footer">${brand()}<span>좋은 대화는, 좋은 시작이니까.</span>${link('/me','미리보기 안내','quiet-link')}</footer></div>`;
 const head=`<header class="topbar"><div class="row">${back?'<a class="back" href="#'+back+'" aria-label="뒤로">'+icon('back')+'</a>':''}<h1 tabindex="-1">${title}</h1></div>${chat?link('/connection?id='+encodeURIComponent(route().params.get('id')),'프로필 보기','write-link'):link('/write',icon('plus')+'<span>이야기 쓰기</span>','write-link')}</header>`;
 return `<div class="app-frame"><aside class="desktop-sidebar">${brand()}<nav aria-label="주 메뉴">${nav}</nav>${link('/write',icon('plus')+'이야기 쓰기','btn btn-primary')}<div class="sidebar-bottom"><span class="editorial-small">A little closer.</span><p>한마디에서 시작되는<br>우리 사이.</p>${link('/home','사친사친 소개 '+icon('arrow'),'quiet-link')}</div></aside><div class="app-main ${wide?'wide':''} ${chat?'chat-page':''}">${head}<main class="page ${chat?'chat':''}">${body}</main><nav class="tabbar" aria-label="하단 메뉴">${nav}</nav></div></div>`;
}

function concernRow(c){return `<li><a class="my-story-row" href="#/concern?id=${encodeURIComponent(c.id)}"><div class="row between"><span class="eyebrow">${topic(c.category)}</span><span class="count-badge">답변 ${ownAnswers(c).length}</span></div><h3>${esc(c.title)}</h3><div class="row between"><span class="meta">${c.id==='my-first'?'체험용 이야기':'내가 남긴 이야기'}</span>${icon('arrow')}</div></a></li>`;}
function listen(){const p=route().params,choice=choiceFrom(p);
if(choice){const items=filterConcerns(SAMPLES,choice),label=choice.category?topic(choice.category):'#'+choice.tag,index=Math.min(Math.max(Number.parseInt(p.get('i')??'0',10)||0,0),Math.max(items.length-1,0)),c=items[index],q=choiceQuery(choice);
return shell('발견',`<div class="discover-toolbar">${link('/listen',icon('back')+esc(label),'filter-pill')}<span class="meta">${items.length?index+1:0} / ${items.length}개의 예시 이야기</span></div>${c?`<article class="story-card tone-${c.category}"><header class="story-card-head"><span class="anonymous-avatar">${icon(TOPICS.find(t=>t.id===c.category)?.icon)}</span><div><strong>어느 누군가의 이야기</strong><span>프로필 비공개</span></div>${icon('lock')}</header><div class="story-content"><span class="eyebrow">요즘 내 마음에 남은 건</span><h2>${esc(c.title)}</h2><p>${esc(c.body.split('\n')[0])}</p>${tags(c.tags)}</div><div class="story-card-bottom"><span>${icon('feed')}당신의 생각이 궁금해요</span><span class="small">예시</span></div></article><div class="discovery-actions">${index<items.length-1?link('/listen?'+q+'&i='+(index+1),'<span aria-hidden="true">×</span><span class="sr-only">다음 이야기</span>','round-btn'):link('/listen',icon('compass')+'<span class="sr-only">다른 주제 고르기</span>','round-btn')}${link('/concern?id='+encodeURIComponent(c.id)+'&'+q,'한마디 건네기 '+icon('feed'),'btn btn-primary btn-lg')}</div>${index>0?link('/listen?'+q+'&i='+(index-1),'이전 이야기','previous-story'):''}<p class="center meta discovery-hint">${index<items.length-1?'부담 없이 넘겨도 괜찮아요.':'이 주제의 이야기를 모두 봤어요. 다른 주제도 만나보세요.'}</p>`:empty('아직 조용한 주제예요.','다른 이야기에서 마음이 통할지도 몰라요.',link('/listen','다른 주제 보기'))}${previewFoot()}`,{back:'/home'});}
return shell('발견',`<section class="page-intro"><span class="eyebrow">FIND YOUR CONVERSATION</span><h2>오늘은 어떤<br><em>이야기가 끌려요?</em></h2><p>주제를 고르면, 그 안의 이야기만 보여요.</p></section><div class="topic-grid">${TOPICS.map(t=>`<a class="topic-choice tone-${t.id}" href="#/listen?category=${t.id}" aria-label="${t.name} 이야기 찾기"><span class="topic-art">${icon(t.icon)}</span><div><strong>${t.name}</strong><span>${t.description}</span></div><span class="topic-arrow">↗</span></a>`).join('')}</div><section class="tag-search-section"><div class="section-line"><h3>떠오르는 단어가 있나요?</h3><span class="meta">#해시태그</span></div><form id="search-form"><div class="search-field">${icon('search')}<label class="sr-only" for="tag-search">찾고 싶은 해시태그</label><input id="tag-search" name="tag" placeholder="예: 관계의거리" maxlength="16" required><button type="submit" aria-label="해시태그 찾기">${icon('arrow')}</button></div><p id="search-error" class="field-help danger" role="alert"></p></form><div class="discovery-tags">${['관계의거리','퇴근후','마음알아가기','내속도'].map(t=>link('/listen?tag='+encodeURIComponent(t),'#'+t,'tag-link')).join('')}</div></section>${previewFoot()}`,{wide:true});}



function write(){const d=state.draft;return shell('이야기 쓰기',`<section class="page-intro compact"><span class="eyebrow">JUST BETWEEN US</span><h2>어떤 마음이었어요?</h2><p>잘 쓴 글보다, 당신다운 한마디면 돼요.</p></section><form id="concern-form"><fieldset class="field"><legend>먼저, 이야기의 주제</legend><div class="chip-options">${TOPICS.map(t=>`<label><input type="radio" name="category" value="${t.id}" required ${d.category===t.id?'checked':''}><span>${t.name}</span></label>`).join('')}</div></fieldset><div class="writing-paper"><div class="field"><label for="concern-title">요즘 내 마음에 남은 건</label><input class="input title-input" id="concern-title" name="title" value="${esc(d.title)}" placeholder="한 문장으로 시작해 볼까요?" minlength="5" maxlength="80" required><p class="field-help">5~80자</p></div><div class="field"><label class="sr-only" for="concern-body">이야기 내용</label><textarea class="input writing-body" id="concern-body" name="body" placeholder="어떤 일이 있었는지, 어떤 생각이 드는지. 편하게 들려주세요." minlength="20" maxlength="2000" required>${esc(d.body)}</textarea><p class="field-help"><span id="body-count">${d.body.length}</span> / 2,000 · 20자 이상</p></div></div><div class="field"><label for="concern-tags">해시태그 <span class="meta">선택</span></label><input class="input" id="concern-tags" name="tags" value="${esc(d.tags)}" placeholder="#관계의거리 #내속도" maxlength="80"><p class="field-help">최대 3개 · 태그마다 15자 이내</p></div>${privacy('주제를 고른 사람에게만, 프로필 없이 전해져요. 이름·연락처는 빼주세요.')}<p id="form-error" class="danger" role="alert"></p><button class="btn btn-primary btn-block" type="submit">이야기 남기기 ${icon('arrow')}</button><p class="form-note">작성 내용은 이 브라우저에만 저장돼요.</p></form>`,{back:'/mine'});}



function detail(){const p=route().params,c=getConcern(p.get('id'));
if(!c)return shell('이야기',empty('이야기를 찾지 못했어요.','다른 이야기를 만나볼까요?',link('/listen','발견으로 가기')),{back:'/listen'});
if(!c.own&&!filterConcerns([c],choiceFrom(p)).length)return shell('이야기',empty('먼저, 주제를 골라주세요.','선택한 주제 안에서만 이야기를 만날 수 있어요.',link('/listen','주제 고르기')),{back:'/listen'});
const answered=state.answers.find(a=>a.concernId===c.id),answers=c.own?ownAnswers(c):[];
const intro=`<article class="detail-story"><div class="row between"><span class="eyebrow">${topic(c.category)} · ${c.own?'내 이야기':'익명의 이야기'}</span>${icon('lock')}</div><h2>${esc(c.title)}</h2><p class="prose">${esc(c.body)}</p>${tags(c.tags)}</article>`;
const content=c.own?`<div class="section-line answer-heading"><h2>나에게 온 한마디 <span>${answers.length}</span></h2><span class="meta">${answers.length?'예시 답변':''}</span></div>${answers.length?answers.map((a,i)=>`<article class="answer-card"><header><span class="anonymous-avatar answer-${i}">${icon(i?'sun':'heart')}</span><span>${esc(a.alias)}</span><span class="meta">프로필 비공개</span></header><p class="prose">${esc(a.body)}</p>${link('/connection?id='+encodeURIComponent(connectionKey(c.id,a.id))+'&concern='+encodeURIComponent(c.id)+'&answer='+a.id,icon('heart')+'이 사람이 궁금해요','answer-like')}</article>`).join(''):empty('당신의 이야기에 귀 기울이는 중.','답변이 도착하면 여기서 볼 수 있어요.')}${!answers.length?demo('답변을 받은 다음 흐름을 체험해 보세요.','demo-answer','예시 답변 받아보기',`data-id="${esc(c.id)}"`):''}`:answered?`<article class="answer-card"><span class="eyebrow">내가 건넨 한마디</span><p class="prose">${esc(answered.body)}</p><div class="sent-label">${icon('check')}답변을 남겼어요</div></article>${link('/listen?'+choiceQuery(choiceFrom(p)),'다른 이야기 만나기 '+icon('arrow'),'btn btn-primary btn-block')}`:`<form id="answer-form" data-id="${esc(c.id)}" class="reply-form"><label for="answer-body">당신이라면, 어떤 말을 해줄래요?</label><textarea class="input" id="answer-body" name="body" minlength="20" maxlength="2000" required placeholder="내 생각은 이래요…"></textarea><div class="row between field-help"><span>${icon('lock')}당신의 프로필도 비공개</span><span>20자 이상</span></div><button type="submit" class="btn btn-primary btn-block">한마디 건네기 ${icon('arrow')}</button></form>`;
return shell(c.own?'내 이야기':'한마디 건네기',intro+content+previewFoot(),{back:c.own?'/mine':'/listen?'+choiceQuery(choiceFrom(p))});}
function mine(){const answers=route().params.get('tab')==='answers';return shell('내 이야기',`<section class="page-intro compact"><span class="eyebrow">WORDS THAT STAY</span><h2>오고 간 마음들.</h2></section><nav class="small-tabs" aria-label="이야기 종류">${link('/mine','받은 답변',!answers?'active':'')}${link('/mine?tab=answers','내가 건넨 말',answers?'active':'')}</nav>${answers?(state.answers.length?`<ul class="list my-stories">${state.answers.map(a=>{const c=getConcern(a.concernId);return c?`<li><a class="my-story-row" href="#/concern?id=${esc(c.id)}&category=${esc(c.category)}"><span class="eyebrow">${topic(c.category)} · 답변 완료</span><h3>${esc(c.title)}</h3><p class="item-preview">${esc(a.body)}</p>${icon('arrow')}</a></li>`:'';}).join('')}</ul>`:empty('아직 건네지 않은 한마디.','당신과 비슷한 생각을 하는 사람이 있을지도 몰라요.',link('/listen','이야기 만나러 가기'))):`<ul class="list my-stories">${[...state.concerns].reverse().concat(MY_SAMPLE).map(concernRow).join('')}</ul>${link('/write',icon('plus')+'새 이야기 남기기','btn btn-outline btn-block gap-top')}`}${previewFoot()}`);}


function journey(step){return `<ol class="journey"><li class="${step===1?'current':'done'}"><span>1</span>답변</li><li class="${step===2?'current':step>2?'done':''}"><span>2</span>프로필 공개</li><li class="${step===3?'current':''}"><span>3</span>대화 선택</li></ol>`;}
function status(c){return c.closed?'연결 종료':chatAllowed(c)?'대화 중':profilesVisible(c)?c.mineChat?'상대의 대화 선택을 기다려요':'프로필 확인 · 대화 선택':'프로필 공개를 기다려요';}

function connections(){const items=allConnections(),tab=route().params.get('tab')??'all',filtered=items.filter(c=>tab==='all'||(tab==='chat'?chatAllowed(c):!c.closed&&!chatAllowed(c)));return shell('연결',`<section class="page-intro compact"><span class="eyebrow">A LITTLE CLOSER</span><h2>한마디, 그다음.</h2></section><nav class="small-tabs" aria-label="연결 상태">${[['all','전체'],['waiting','기다리는 마음'],['chat','대화']].map(([id,label])=>link('/connections'+(id==='all'?'':'?tab='+id),label,id===tab?'active':'')).join('')}</nav>${filtered.length?`<ul class="list connection-list">${filtered.map(c=>`<li><a class="connection-row" href="#/${chatAllowed(c)?'chat':'connection'}?id=${encodeURIComponent(c.id)}">${profilesVisible(c)?portrait('avatar-photo'):'<span class="connection-avatar">'+icon(c.closed?'lock':'heart')+'</span>'}<span class="connection-copy"><span class="connection-status ${chatAllowed(c)?'live':''}">${status(c)}</span><strong>${profilesVisible(c)?'여름산책':'아직은, 익명의 누군가'}</strong><span class="item-preview">${esc(chatAllowed(c)?state.messages.filter(m=>m.connectionId===c.id).at(-1)?.body??'어떤 하루였나요?':getConcern(c.concernId)?.title??'답변에서 시작된 연결')}</span></span>${icon('arrow')}</a></li>`).join('')}</ul>`:empty(tab==='all'?'어떤 한마디는, 시작이 되니까.':'아직 이곳은 비어 있어요.',tab==='all'?'마음에 남은 답변이 있다면<br>그 사람에게 궁금하다고 전해보세요.':'새로운 연결은 답변에서 시작돼요.',link('/concern?id=my-first','도착한 예시 답변 보기 '+icon('arrow')))}${previewFoot()}`);}
function profile(){return `<article class="revealed-profile"><div class="profile-name-row"><div><h2>여름산책</h2><span>${icon('check')}서로 동의해 공개된 프로필</span></div><span class="sample-label">예시</span></div>${portrait('profile-photo')}<div class="profile-facts"><span>29세</span><span>여성</span><span>서울</span><span>디자이너</span></div><div class="profile-prompt"><span class="eyebrow">나와 잘 맞는 사람은</span><h3>답을 서두르지 않고,<br>끝까지 들어주는 사람.</h3></div><div class="profile-prompt"><span class="eyebrow">별것 아닌데 좋아하는 것</span><h3>조용한 서점, 해 질 무렵 산책,<br>그리고 길어지는 대화.</h3></div></article>`;}


function connection(){const p=route().params;const id=p.get('id');let c=state.connections[id];const concern=getConcern(c?.concernId??p.get('concern'));const answer=SAMPLE_ANSWERS.find(a=>a.id===(c?.answerId??p.get('answer')));
  if(!concern||!answer)return shell('서로 알아가기',empty('아직 시작된 연결이 없어요.','마음에 닿은 답변에서 시작해 보세요.',link('/mine','내 이야기 보기')),{back:'/connections'});
  const origin=`<section class="connection-context"><span class="eyebrow">이 답변에서 시작된 마음</span><p class="quote">“${esc(answer.body.split('\n')[0])}”</p><p class="meta">내 고민 · ${esc(concern.title)}</p></section>`;
  let body=journey(!c?1:profilesVisible(c)?3:2)+(profilesVisible(c)?`<details class="connection-origin"><summary>우리가 나눈 첫 이야기</summary>${origin}</details>`:origin);
  if(c?.closed){body+=`<section class="decision-panel center"><div class="privacy-seal">${icon('lock')}</div><h2>여기까지의 마음도 소중해요.</h2><p>연결이 종료되어 프로필은 다시 보이지 않아요.<br>도움이 된 답변은 내 이야기에 남아 있어요.</p>${link('/home','마음 나누기로 돌아가기','btn btn-primary btn-block')}</section>`;}
  else if(!c){body+=`<section class="decision-panel"><span class="eyebrow">답변을 넘어, 조금 더 궁금해졌다면</span><h2>그 한마디를 건넨 사람,<br>궁금하지 않나요?</h2><p>상대도 동의하면 두 사람의 프로필이 함께 공개돼요. 프로필을 본 뒤, 대화할지는 다시 선택해요.</p><div class="own-profile"><strong>상대에게 공개되는 내 정보</strong><p class="card-note">프로필 사진 · 닉네임 · 성별 · 나이 · 활동 지역 · 직업 · 자기소개 · 관심사</p></div><label class="checkbox-row"><input id="reveal-consent" type="checkbox">위 정보를 이 상대와 서로 공개하는 데 동의해요.</label>${button('request','서로 프로필 보기','btn btn-primary btn-block',`data-id="${esc(id)}" data-concern="${esc(concern.id)}" data-answer="${esc(answer.id)}" disabled`)}${link('/concern?id='+concern.id,'답변으로 돌아가기','btn btn-outline btn-block')}</section>`;}
  else if(!profilesVisible(c)){body+=`<section class="decision-panel center"><div class="privacy-seal">${icon('lock')}</div><span class="eyebrow">프로필 교환 요청을 보냈어요</span><h2>같은 마음이길,<br>조금만 기다려요.</h2><p>상대의 동의를 기다리는 중이에요.<br>아직 두 사람의 프로필은 공개되지 않았어요.</p>${button('ask-close','요청 취소하기','btn btn-outline',`data-id="${esc(id)}"`)}</section>${demo('실제 상대에게 요청이 전송되지는 않아요. 상대가 동의한 상황을 이어서 확인할 수 있어요.','demo-reveal','상대의 프로필 공개 동의 재현',`data-id="${esc(id)}"`)}`;}
  else {body+=profile();if(chatAllowed(c)){body+=`<section class="decision-panel"><span class="eyebrow">두 사람 모두 대화를 선택했어요</span><h2>두 사람, 같은 마음.</h2><p>고민에서 시작된 마음을 천천히 이어가 보세요.</p>${link('/chat?id='+id,'대화방으로 가기 '+icon('arrow'),'btn btn-primary btn-block')}</section>`;}
    else if(c.mineChat){body+=`<section class="decision-panel"><span class="eyebrow">당신의 선택을 전했어요</span><h2>상대의 마음도 기다려요.</h2><p>상대도 대화를 선택하면 채팅방이 열려요. 아직 채팅은 시작되지 않았어요.</p>${button('ask-close','여기까지 할게요','btn btn-outline',`data-id="${esc(id)}"`)}</section>${demo('상대가 프로필을 확인하고 대화를 선택한 상황을 재현해요.','demo-chat','상대의 대화 선택 재현',`data-id="${esc(id)}"`)}`;}
    else body+=`<section class="decision-panel"><span class="eyebrow">서로를 확인한 뒤, 당신의 선택</span><h2>조금 더 이야기해 볼까요?</h2><p>둘 다 원할 때만 채팅방이 열려요. 마음이 가지 않는다면 여기서 마쳐도 괜찮아요.</p>${button('choose-chat','대화해 보고 싶어요','btn btn-primary btn-block',`data-id="${esc(id)}"`)}${button('ask-close','여기까지 할게요','btn btn-outline btn-block',`data-id="${esc(id)}"`)}</section>`;
  }
  return shell('서로 알아가기',body+previewFoot(),{back:'/connections'});
}


function chat(){const c=currentConnection();if(!chatAllowed(c))return shell('대화',empty('같은 마음이 모이면 열려요.','프로필을 확인한 뒤, 둘 다 대화를 선택해야 해요.',link(c?'/connection?id='+encodeURIComponent(c.id):'/connections','연결 확인하기')),{back:'/connections'});
const messages=state.messages.filter(m=>m.connectionId===c.id);
return shell('여름산책',`<div class="chat-person">${portrait('avatar-photo')}<span><strong>여름산책</strong><small>서로 대화를 선택했어요 · 예시</small></span>${button('ask-close','대화 끝내기','quiet-link',`data-id="${esc(c.id)}"`)}</div><div class="chat-body" id="chat-messages" role="log" aria-label="대화 내용"><p class="msg system">한마디에서 시작된 우리.<br>여기서는 편하게 이야기해요.</p><div class="chat-context">${icon('feed')}<span>${esc(getConcern(c.concernId)?.title)}</span></div><div class="msg theirs"><span class="who">여름산책 · 예시 메시지</span>제 답변이 조금이나마 도움이 됐다니 기뻐요. 오늘은 어떤 하루였나요?</div>${messages.map(m=>`<div class="msg ${m.mine?'mine':'theirs'}">${!m.mine?'<span class="who">여름산책 · 예시 응답</span>':''}${esc(m.body)}<time>${esc(m.time)}</time></div>`).join('')}</div>${messages.some(m=>m.mine)?button('demo-reply','예시 답장 받아보기','chat-replay',`data-id="${esc(c.id)}"`):''}<form id="chat-form" class="chat-input" data-id="${esc(c.id)}"><label for="chat-message" class="sr-only">메시지</label><textarea id="chat-message" name="body" rows="1" maxlength="1000" required placeholder="어떤 얘기든 좋아요"></textarea><button class="send-btn" type="submit" aria-label="메시지 보내기">${icon('arrow')}</button></form>`,{back:'/connections',chat:true});}
function me(){return shell('나',`<section class="me-heading"><span class="my-avatar">${icon('me')}</span><div><h2>느린숲</h2><p>나답게, 천천히.</p><span class="sample-label">예시 계정 · 남성 · 30세</span></div></section>${privacy('내 프로필은 서로 동의한 상대에게만 보여요.')}<section class="settings"><h3>내 공간</h3>${link('/mine','내 이야기와 답변 '+icon('arrow'),'settings-row')}${link('/connections','연결과 대화 '+icon('arrow'),'settings-row')}${link('/home','사친사친 처음부터 보기 '+icon('arrow'),'settings-row')}</section><section class="preview-info"><span class="eyebrow">ABOUT THIS PREVIEW</span><h3>지금은 미리보기예요.</h3><p>이야기, 답변, 인물은 모두 가상입니다. 사진은 AI로 만든 연출 이미지예요. 직접 작성한 내용은 이 브라우저에만 저장되며 실제 회원에게 전달되지 않아요.</p><p>실제 가입·매칭·알림은 연결되어 있지 않아요. 상대의 동의는 ‘미리보기’ 버튼으로 체험할 수 있어요.</p></section><button class="settings-row reset-row" type="button" data-action="ask-reset">체험 기록 초기화 ${icon('arrow')}</button>${previewFoot()}`);}


function render(){const {path}=route();const pages={'/home':home,'/listen':listen,'/write':write,'/concern':detail,'/mine':mine,'/connections':connections,'/connection':connection,'/chat':chat,'/me':me};$('#app').innerHTML=(pages[path]??home)();document.title=($('#app h1')?.textContent??'마음 나누기')+' · 사친사친';window.scrollTo({top:0,behavior:'instant'});$('#app h1')?.focus({preventScroll:true});if(path==='/chat')$('#chat-messages')?.scrollTo({top:$('#chat-messages').scrollHeight});$('#announcer').textContent=document.title;}
function showDialog(title,copy,confirmLabel,onConfirm){
  document.querySelector('dialog')?.remove();const dialog=document.createElement('dialog');dialog.className='native-dialog';dialog.setAttribute('aria-labelledby','dialog-title');dialog.innerHTML=`<h2 id="dialog-title">${esc(title)}</h2><p>${esc(copy)}</p><div class="dialog-actions"><button class="btn btn-outline" data-cancel>돌아가기</button><button class="btn btn-primary" data-confirm>${esc(confirmLabel)}</button></div>`;document.body.append(dialog);dialog.querySelector('[data-cancel]').onclick=()=>dialog.close();dialog.querySelector('[data-confirm]').onclick=()=>{dialog.close();onConfirm();};dialog.addEventListener('close',()=>dialog.remove());dialog.showModal();
}

document.addEventListener('input',event=>{const form=event.target.closest('#concern-form');if(form){const f=new FormData(form);state.draft={category:String(f.get('category')??''),title:String(f.get('title')??''),body:String(f.get('body')??''),tags:String(f.get('tags')??'')};$('#body-count').textContent=state.draft.body.length;save();}if(event.target.id==='reveal-consent')document.querySelector('[data-action="request"]').disabled=!event.target.checked;});
document.addEventListener('submit',event=>{
  const form=event.target;event.preventDefault();const f=new FormData(form);
  if(form.id==='search-form'){const tag=String(f.get('tag')).trim().replace(/^#/,'');if(!tag||tag.length>15||/[\s,#]/.test(tag)){ $('#search-error').textContent='해시태그 하나를 띄어쓰기 없이 15자 이내로 입력해 주세요.';return;}navigate('/listen?tag='+encodeURIComponent(tag));}
  if(form.id==='concern-form'){
    const category=String(f.get('category')??''),title=String(f.get('title')).trim(),body=String(f.get('body')).trim();const inputTags=[...new Set(String(f.get('tags')).split(/[\s,#]+/).filter(Boolean))];
    if(!TOPICS.some(t=>t.id===category)||title.length<5||body.length<20){$('#form-error').textContent='주제를 고르고, 제목 5자·내용 20자 이상을 입력해 주세요.';return;}
    if(inputTags.length>3||inputTags.some(t=>t.length>15)){ $('#form-error').textContent='해시태그는 각각 15자 이내, 최대 3개로 입력해 주세요.';return; }
    const id='local-'+crypto.randomUUID();state.concerns.push({id,category,title,body,tags:inputTags,own:true});state.draft=initialState().draft;save();navigate('/concern?id='+id);toast('이 브라우저에 고민을 남겼어요.');
  }
  if(form.id==='answer-form'){const body=String(f.get('body')).trim(),c=getConcern(form.dataset.id);if(!c||!filterConcerns([c],choiceFrom(route().params)).length)return;if(body.length<20){toast('답변을 20자 이상 적어 주세요.');return;}if(!state.answers.some(a=>a.concernId===form.dataset.id))state.answers.push({concernId:form.dataset.id,body});save();render();toast('체험 답변을 저장했어요.');}
  if(form.id==='chat-form'){const c=state.connections[form.dataset.id],body=String(f.get('body')).trim();if(!chatAllowed(c)||!body)return;state.messages.push({connectionId:c.id,mine:true,body,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})});save();render();$('#chat-message')?.focus({preventScroll:true});}
});
document.addEventListener('click',event=>{
  const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const action=target.dataset.action,id=target.dataset.id;
  if(action==='demo-answer'){const concern=state.concerns.find(c=>c.id===id);if(concern){concern.mockAnswers=true;save();render();toast('예시 답변이 도착한 화면이에요.');}}
  if(action==='request'){
    if(!$('#reveal-consent')?.checked)return;
    const c={id,concernId:target.dataset.concern,answerId:target.dataset.answer,mineReveal:false,theirReveal:false,mineChat:false,theirChat:false,closed:false};state.connections[id]=transition(c,'request');save();navigate('/connection?id='+encodeURIComponent(id));
  }
  if(['demo-reveal','choose-chat','demo-chat'].includes(action)&&state.connections[id]){state.connections[id]=transition(state.connections[id],action);save();render();if(action==='demo-chat')toast('두 사람 모두 대화를 선택한 화면이에요.');}
  if(action==='ask-close')showDialog('여기서 마칠까요?','연결을 마치면 프로필과 대화방을 더 이상 볼 수 없어요. 받은 답변은 내 이야기에 남아요.','연결 마치기',()=>{state.connections[id]=transition(state.connections[id],'close');save();navigate('/connection?id='+encodeURIComponent(id));});
  if(action==='demo-reply'&&chatAllowed(state.connections[id])){state.messages.push({connectionId:id,mine:false,body:'이야기해 줘서 고마워요. 서두르지 말고 편하게 알아가요.',time:'예시 응답'});save();render();}
  if(action==='ask-reset')showDialog('체험 기록을 초기화할까요?','이 브라우저에서 직접 작성한 고민과 답변, 연결과 대화가 지워져요. 기본 예시는 그대로 남아요.','초기화하기',()=>{state=initialState();save();navigate('/home');toast('처음부터 다시 둘러볼 수 있어요.');});
});
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
