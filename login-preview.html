:root{color-scheme:light;--paper:#e1e1e1;--sheet:#ececea;--ink:#242424;--muted:#64636b;--blue:#1d00ce;--line:#bdbcc3;--error:#a32946;font-family:'Gowun Dodum',sans-serif;font-synthesis:none;background:var(--paper);color:var(--ink)}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid var(--blue);outline-offset:4px}button,input{border-radius:0}button{color:inherit}p,h1,h2{margin:0}html{scroll-behavior:auto}input{min-width:0}button:disabled{cursor:default}button:active{filter:brightness(.94)}
.login-page{width:100%;max-width:470px;min-height:100vh;min-height:100svh;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 26px env(safe-area-inset-bottom)}
.page-header{display:flex;align-items:center;min-height:68px;margin:0 -10px}.back-button{display:grid;place-items:center;width:44px;height:44px;background:transparent;border:0}
main{width:100%}.greeting{padding-top:20px;margin-bottom:38px}.greeting-signature{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;min-height:76px}.wordmark{display:block;width:205px;height:auto;max-width:calc(100% - 86px)}.greeting h1{font-size:32px;line-height:1.5;letter-spacing:-1.15px;font-weight:400;word-break:keep-all}
.welcome-note{width:70px;height:78px;flex:none;color:var(--blue);overflow:visible;transform:rotate(-7deg);margin-right:4px}.welcome-note-paper{fill:#d5d0eb}.welcome-note text{font-family:inherit;font-size:18px;fill:currentColor}
form{display:flex;flex-direction:column;gap:23px}.field{display:flex;flex-direction:column;gap:10px}.field label{font-size:15px;line-height:1.5}.input-wrap{border:1px solid var(--line);border-radius:13px;background:var(--sheet);display:flex;align-items:center;min-height:58px}.input-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.input-wrap:has([aria-invalid="true"]){border-color:var(--error)}.input-wrap input{width:100%;height:56px;padding:14px 16px;font-size:16px;line-height:1.6;color:var(--ink);background:transparent;border:0;outline:none;caret-color:var(--blue)}input::placeholder{color:#76747e;opacity:1}.password-wrap input{padding-right:3px}.password-toggle{border:0;background:transparent;flex:0 0 56px;min-height:44px;font-size:13px;color:var(--muted);margin-right:3px}.password-toggle:focus-visible{outline-offset:-5px;border-radius:9px}.field-error{font-size:13px;line-height:1.6;color:var(--error)}.field-error:empty{display:none}
.text-button{min-height:44px;border:0;background:transparent;padding:8px 0;font-size:14px;line-height:1.6}.login-button{width:100%;border:1px solid var(--blue);background:var(--blue);color:#fff;min-height:58px;border-radius:13px;padding:14px 20px;font-size:19px;font-weight:400;line-height:1.5}form>.login-button{margin-top:6px}.account-help{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:0 18px;margin:20px 0 0;color:var(--muted)}.help-divider{height:12px;width:1px;background:#b7b5bf}.signup-button{color:var(--blue)}
footer{margin-top:auto;padding:36px 0 22px;text-align:center}footer p{font-size:11px;color:#68666f;line-height:1.7}noscript p{font-size:13px;margin-top:18px}
dialog{width:calc(100% - 36px);max-width:370px;max-height:calc(100dvh - 40px);padding:0;border:1px solid var(--line);border-radius:22px;background:var(--sheet);color:var(--ink)}dialog::backdrop{background:#25213466}.dialog-content{padding:28px 24px;overflow:auto}.dialog-eyebrow{font-size:12px;color:var(--blue);margin-bottom:15px}dialog h2{font-size:24px;font-weight:400;line-height:1.5;word-break:keep-all}#dialog-copy{font-size:15px;line-height:1.8;color:var(--muted);margin:16px 0 26px;white-space:pre-line;word-break:keep-all}dialog .login-button{font-size:17px;min-height:52px}
@media(max-width:359px){.login-page{padding-left:22px;padding-right:22px}.greeting{padding-top:10px;margin-bottom:30px}.greeting h1{font-size:29px;letter-spacing:-1px}.greeting-signature{gap:12px;margin-bottom:20px}.wordmark{max-width:calc(100% - 80px)}.welcome-note{width:64px;height:72px}.input-wrap input{font-size:16px;padding-left:13px}.password-toggle{flex-basis:47px}.account-help{gap:0 14px}.account-help .text-button{font-size:13px}}
@media(min-width:700px){.login-page{padding-top:24px;padding-bottom:20px}.greeting{padding-top:32px}.greeting h1{font-size:34px}footer{padding-top:48px}}

/* Selected layout: a centered welcome above a lower, naturally flowing form. */
.layout-a .page-header{min-height:54px;flex-shrink:0}
.layout-a main{display:flex;flex:1;flex-direction:column}
.layout-a .greeting{flex-shrink:0;padding-top:0;margin-bottom:0;text-align:center}
.layout-a .greeting-signature{flex-direction:column;justify-content:center;gap:14px;margin-bottom:10px;min-height:0}
.layout-a .wordmark{width:210px;max-width:100%}
.layout-a .welcome-note{width:62px;height:60px;margin:0;transform:rotate(-7deg)}
.layout-a .greeting h1{font-size:29px;line-height:1.5;letter-spacing:-1px}
.layout-a .login-controls{flex-shrink:0;margin-top:auto;padding-top:clamp(44px,7svh,64px)}
.layout-a form{gap:20px}
.layout-a .account-help{margin-top:16px}
.layout-a footer{flex-shrink:0;margin-top:0;padding-top:26px}
@media(max-width:359px){
  .layout-a .greeting{padding-top:0;margin-bottom:0}
  .layout-a .greeting-signature{gap:10px;margin-bottom:8px}
  .layout-a .wordmark{width:190px;max-width:100%}
  .layout-a .welcome-note{width:57px;height:54px}
  .layout-a .greeting h1{font-size:27px}
}
@media(min-width:700px){.layout-a .login-page{padding-top:12px}.layout-a .greeting{padding-top:0}}
</style>

        <h1 id="login-title">반가워요<br>편하게 이야기해요</h1>
      </section>
      <div class="login-controls">
      <form id="login-form" novalidate autocomplete="off">
        <div class="field">
          <label for="email">이메일</label>
          <div class="input-wrap"><input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" enterkeyhint="next" maxlength="254" placeholder="name@example.com" aria-describedby="email-error" required></div>
          <p class="field-error" id="email-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <div class="input-wrap password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" enterkeyhint="go" placeholder="비밀번호 입력" aria-describedby="password-error" required>
            <button class="password-toggle" type="button" aria-label="비밀번호 표시" aria-pressed="false">보기</button>
          </div>
          <p class="field-error" id="password-error" aria-live="polite"></p>
        </div>
        <button class="login-button" type="submit">로그인</button>
      </form>
      <nav class="account-help" aria-label="계정 도움말"><button class="text-button" type="button" data-preview="reset">비밀번호 찾기</button><span class="help-divider" aria-hidden="true"></span><button class="text-button signup-button" type="button" data-preview="signup">이메일로 가입하기</button></nav>
      </div>
      <noscript><p>입력 동작을 확인하려면 JavaScript를 켜 주세요</p></noscript>
    </main>
    <footer><p>화면 미리보기 · 입력 정보는 저장되지 않아요</p></footer>
  </div>
  <dialog aria-labelledby="dialog-title" aria-describedby="dialog-copy">
    <div class="dialog-content"><p class="dialog-eyebrow">화면 미리보기</p><h2 id="dialog-title"></h2><p id="dialog-copy"></p><button class="login-button" id="dialog-close" type="button">확인</button></div>
  </dialog>
  <script>// Standalone design sample: no authentication, persistence, analytics or network calls.
const form=document.querySelector('#login-form');
const email=document.querySelector('#email');
const password=document.querySelector('#password');
const toggle=document.querySelector('.password-toggle');
const dialog=document.querySelector('dialog');
const previews={
  back:['온보딩 다음에 만나는 화면이에요','스플래시 → 서비스 소개 → 로그인\n로그인하면 홈에서 고민을 둘러보게 돼요'],
  reset:['비밀번호 찾기로 이어져요','가입한 이메일로 재설정 링크를 받는 흐름이에요\n이번 샘플에서는 이메일을 보내지 않아요'],
  signup:['이메일로 가입해요','이메일로 계정을 만들고 성인 인증을 거쳐 시작하는 흐름이에요\n이번에는 로그인 화면만 확인할 수 있어요'],
  login:['로그인하면 홈으로 이어져요','고민을 먼저 둘러보고 답변할 수 있어요\n지금은 화면 샘플이라 실제 로그인되지는 않아요']
};
function showPreview(key){const [title,copy]=previews[key];document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-copy').textContent=copy;dialog.showModal();}
function setError(input,message){document.getElementById(input.id+'-error').textContent=message;if(message)input.setAttribute('aria-invalid','true');else input.removeAttribute('aria-invalid');}
function hidePassword(){password.type='password';toggle.textContent='보기';toggle.setAttribute('aria-pressed','false');toggle.setAttribute('aria-label','비밀번호 표시');}
toggle.addEventListener('click',()=>{const visible=password.type==='password';password.type=visible?'text':'password';toggle.textContent=visible?'숨기기':'보기';toggle.setAttribute('aria-pressed',String(visible));toggle.setAttribute('aria-label',visible?'비밀번호 숨기기':'비밀번호 표시');});
for(const input of [email,password])input.addEventListener('input',()=>setError(input,''));
form.addEventListener('submit',event=>{
  event.preventDefault();email.value=email.value.trim();
  const emailError=!email.value?'이메일 주소를 입력해 주세요':!email.validity.valid?'이메일 주소를 다시 확인해 주세요':'';
  const passwordError=!password.value?'비밀번호를 입력해 주세요':'';
  setError(email,emailError);setError(password,passwordError);
  if(emailError||passwordError){(emailError?email:password).focus();return;}
  password.value='';hidePassword();showPreview('login');
});
document.querySelectorAll('[data-preview]').forEach(button=>button.addEventListener('click',()=>showPreview(button.dataset.preview)));
document.querySelector('#dialog-close').addEventListener('click',()=>dialog.close());
document.addEventListener('visibilitychange',()=>{if(document.hidden)hidePassword();});
window.addEventListener('pagehide',()=>{form.reset();hidePassword();});
</script>
